<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Living Jungle Wall</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="wall" aria-label="Interactive tropical jungle wall">
      <canvas id="scene" aria-label="A reactive tropical jungle scene"></canvas>
      <div id="loader" class="loader" aria-hidden="true">
        <div class="loader-track">
          <div id="loader-bar" class="loader-bar"></div>
        </div>
      </div>
      <button id="scenery-toggle" class="scenery-toggle" type="button" aria-pressed="false" aria-label="Hide island and plants (H)" title="Hide island and plants (H)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M5 19l8-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path class="slash" d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </main>
    <script type="module" src="./main.js"></script>
    <script>
      // Installable app + offline use after the first visit (see sw.js). Not inside the
      // Android app, which carries every file already: remove any worker there instead.
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        if (location.hostname === 'appassets.androidplatform.net') {
          navigator.serviceWorker.getRegistrations().then((all) => all.forEach((reg) => reg.unregister()));
        } else {
          navigator.serviceWorker.register('./sw.js');
        }
      }
    </script>
  </body>
</html>
